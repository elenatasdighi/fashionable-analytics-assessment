version: 2

sources:
  - name: fashionable
    description: Raw eCommerce sales data.
    database: fashionable
    schema: raw

    tables:
      - name: fashionable_sales_raw
        description: Raw order line items loaded without transformation.

        columns:
          - name: index
            description: Export row number.

          - name: 'Order ID'
            description: Marketplace order ID.

          - name: Date
            description: Order date as text.

          - name: Status
            description: Order status.

          - name: Fulfilment
            description: Fulfilment provider.

          - name: 'Sales Channel'
            description: Sales channel.

          - name: ship-service-level
            description: Shipping service level.

          - name: Style
            description: Product style code.

          - name: SKU
            description: Product SKU.

          - name: Category
            description: Product category.

          - name: Size
            description: Product size.

          - name: ASIN
            description: Amazon product identifier.

          - name: 'Courier Status'
            description: Courier delivery status.

          - name: Qty
            description: Ordered quantity.

          - name: currency
            description: Currency code.

          - name: Amount
            description: Line-item amount.

          - name: ship-city
            description: Shipping city.

          - name: ship-state
            description: Shipping state.

          - name: ship-postal-code
            description: Shipping postal code.

          - name: ship-country
            description: Shipping country.

          - name: promotion-ids
            description: Promotion IDs.

          - name: B2B
            description: B2B order flag.

          - name: fulfilled-by
            description: Fulfilment method.

          - name: 'Unnamed: 22'
            description: Unused export column.
