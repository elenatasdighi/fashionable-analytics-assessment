name: 'fashionable_analytics'
version: '1.0.0'
config-version: 2

profile: 'fashionable_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Medallion layering enforced by folder + schema:
#   staging       (bronze->silver)  : views in schema `staging`
#   intermediate  (silver)          : views in schema `intermediate`
#   marts         (gold)            : tables in schemas `marts_dim` / `marts_fct`
# See macros/generate_schema_name.sql for how +schema maps to real schema names.
models:
  fashionable_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      dimensions:
        +schema: marts
        +tags: ["dim"]
      facts:
        +schema: marts
        +tags: ["fact"]
